<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MANGA FORGE</title><style>body{margin:0;background:#050507;color:#f7f2fb;font-family:Arial,sans-serif}header{position:sticky;top:0;background:#09070ddd;padding:18px;border-bottom:1px solid #281d31;z-index:5}.wrap{width:min(1100px,92%);margin:auto}.nav{display:flex;gap:12px;align-items:center}.brand{font-weight:900}.search{margin-right:auto;background:#0e0a12;border:1px solid #2b2032;color:white;padding:10px;border-radius:10px}.btn{background:#100c14;color:white;border:1px solid #33263c;border-radius:10px;padding:9px 13px;cursor:pointer}.primary{background:#8430ef;border:0}.hero{padding:90px 0;background:radial-gradient(circle at 70%,#782ce633,transparent 55%)}h1{font-size:70px}h1 span{color:#ae55ff}.muted{color:#a095a8;line-height:2}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.section{padding:45px 0}.card,.panel{background:#0e0a12;border:1px solid #2b2032;border-radius:16px;overflow:hidden}.cover{height:230px;background:radial-gradient(circle at 60% 20%,#9b3dff99,transparent 30%),linear-gradient(145deg,#271331,#08070b)}.card:nth-child(2) .cover{background:radial-gradient(circle,#5d5fff88,transparent 30%),linear-gradient(145deg,#111a2a,#08070b)}.card:nth-child(3) .cover{background:radial-gradient(circle,#c23a8888,transparent 30%),linear-gradient(145deg,#2b111a,#08070b)}.body,.panel{padding:14px}.body small{display:block;color:#91859a;margin-top:6px}.actions{display:flex;gap:7px;margin-top:10px}.modal,.reader{display:none;position:fixed;inset:0;background:#000d;z-index:20}.modal{place-items:center}.box{width:min(420px,90%);background:#120d16;padding:22px;border:1px solid #392844;border-radius:18px}.box input,.box textarea{width:100%;margin:7px 0;padding:11px;background:#08070b;color:white;border:1px solid #30233a;border-radius:10px}.reader{overflow:auto;background:#030304}.readerbar{position:sticky;top:0;background:#09070de8;padding:14px;display:flex;justify-content:space-between}.pages{width:min(800px,94%);margin:20px auto}.page{min-height:600px;background:#eee;color:#222;margin:14px 0;padding:30px;display:grid;place-items:center;text-align:center}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:48px}.search{display:none}}</style>
<header><div class="wrap nav"><b class="brand">✦ MANGA FORGE</b><a href="#catalog">آثار</a><a href="#library">کتابخانه</a><input id="q" class="search" placeholder="جستجو"><button class="btn" onclick="authBox('login')">ورود</button><button class="btn primary" onclick="authBox('register')">ثبت‌نام</button></div></header>
<main><section class="hero"><div class="wrap"><small>✦ پلتفرم مطالعه مانگا و مانهوا</small><h1>هر صفحه،<br><span>یک جهان جدید.</span></h1><p class="muted">نسخه فول‌استک با حساب کاربری، کتابخانه، علاقه‌مندی، خواننده فصل و پنل مدیریت.</p><button class="btn primary" onclick="catalog.scrollIntoView({behavior:'smooth'})">شروع مطالعه</button></div></section><section class="section" id="catalog"><div class="wrap"><h2>🔥 آثار</h2><div class="grid" id="grid"></div></div></section><section class="section" id="library"><div class="wrap"><h2>❤️ کتابخانه من</h2><div class="panel" id="lib">برای دیدن کتابخانه وارد حساب شو.</div></div></section><section class="section" id="admin" style="display:none"><div class="wrap"><h2>🛠️ پنل مدیریت</h2><div class="panel"><input id="mt" placeholder="نام مانگا"><input id="mg" placeholder="ژانر"><textarea id="md" placeholder="توضیحات"></textarea><button class="btn primary" onclick="addManga()">افزودن اثر</button></div></div></section></main>
<div id="modal" class="modal"><div class="box" id="box"></div></div><div id="reader" class="reader"><div class="readerbar"><b id="rt"></b><button class="btn" onclick="reader.style.display='none'">بستن</button></div><div class="pages" id="pages"></div></div>
<script>let token=localStorage.getItem('mf_token');const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}).then(r=>r.json());async function load(){let a=await api('/api/mangas');grid.innerHTML=a.map(m=>`<article class="card"><div class="cover"></div><div class="body"><b>${m.title}</b><small>${m.genre}</small><div class="actions"><button class="btn primary" onclick="openM(${m.id})">مطالعه</button><button class="btn" onclick="fav(${m.id})">♡</button></div></div></article>`).join('');if(token){let u=await api('/api/me');lib.innerHTML='سلام '+u.name+' 👋<br>کتابخانه آماده است.';if(u.role==='admin')admin.style.display='block'}}async function openM(id){let m=await api('/api/mangas/'+id);rt.textContent=m.title;pages.innerHTML=m.chapters.map(c=>`<button class="btn" style="display:block;width:100%;margin:8px 0;text-align:right" onclick="chapter(${c.id})">فصل ${c.number}: ${c.title}</button>`).join('');reader.style.display='block'}async function chapter(id){let c=await api('/api/chapters/'+id);pages.innerHTML='<div class="page">'+c.content+'</div>'}async function fav(id){if(!token)return authBox('login');await api('/api/favorites/'+id,{method:'POST'});alert('کتابخانه به‌روزرسانی شد')}function authBox(t){box.innerHTML=`<h2>${t==='login'?'ورود':'ساخت حساب'}</h2>${t==='register'?'<input id="n" placeholder="نام کاربری">':''}<input id="e" placeholder="ایمیل"><input id="p" type="password" placeholder="رمز عبور"><button class="btn primary" onclick="submitAuth('${t}')">ادامه</button> <button class="btn" onclick="modal.style.display='none'">بستن</button>`;modal.style.display='grid'}async function submitAuth(t){let o={email:e.value,password:p.value};if(t==='register')o.name=n.value;let r=await api('/api/'+t,{method:'POST',body:JSON.stringify(o)});if(r.token){token=r.token;localStorage.setItem('mf_token',token);modal.style.display='none';load()}else alert(r.error||'خطا')}async function addManga(){let r=await api('/api/mangas',{method:'POST',body:JSON.stringify({title:mt.value,genre:mg.value,description:md.value})});alert(r.error||'افزوده شد');load()}q.addEventListener('input',()=>document.querySelectorAll('.card').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q.value.toLowerCase())?'block':'none'));load();</script></html>
